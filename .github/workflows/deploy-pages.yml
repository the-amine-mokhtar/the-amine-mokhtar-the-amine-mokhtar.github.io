name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run backend tests
        run: npm test
        working-directory: backend

  # Copies any missing hero photo from the old Lovable site and commits it, so the
  # repository becomes self-contained. Does nothing once the photos are in place.
  assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Fetch missing photos
        continue-on-error: true
        run: node scripts/fetch-assets.mjs
      - name: Commit new photos
        run: |
          git add frontend/assets
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add hero photos"
            git push
          fi

  deploy:
    needs: [test, assets]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Check out the branch head so a photo committed by the job above is included.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      # Optional: set the repository variable API_BASE_URL (Settings > Secrets and
      # variables > Actions > Variables) to make the published site use the backend.
      - name: Point the frontend at the backend
        if: ${{ vars.API_BASE_URL != '' }}
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          node -e '
            const base = process.env.API_BASE_URL.replace(/\/+$/, "");
            const config = { useApi: true, apiBase: base };
            require("fs").writeFileSync(
              "frontend/js/config.js",
              "export const CONFIG = " + JSON.stringify(config, null, 2) + ";\n"
            );
          '
          cat frontend/js/config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
